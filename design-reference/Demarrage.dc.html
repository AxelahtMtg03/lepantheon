<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le Pantheon, démarrage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0d12}
button{font-family:inherit}
@keyframes cycle{0%{opacity:1}90%{opacity:1}97%,100%{opacity:0}}
@keyframes ringK{0%{stroke-dasharray:0 352}28%,100%{stroke-dasharray:352 352}}
@keyframes pedK{0%,18%{opacity:0;transform:translateY(-10px)}30%,100%{opacity:1;transform:none}}
@keyframes entK{0%,28%{opacity:0;transform:scaleX(.4)}38%,100%{opacity:1;transform:none}}
@keyframes col0{0%,36%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
@keyframes col1{0%,39%{transform:scaleY(0)}48%,100%{transform:scaleY(1)}}
@keyframes col2{0%,42%{transform:scaleY(0)}51%,100%{transform:scaleY(1)}}
@keyframes col3{0%,45%{transform:scaleY(0)}54%,100%{transform:scaleY(1)}}
@keyframes col4{0%,48%{transform:scaleY(0)}57%,100%{transform:scaleY(1)}}
@keyframes col5{0%,51%{transform:scaleY(0)}60%,100%{transform:scaleY(1)}}
@keyframes baseK{0%,54%{opacity:0}62%,100%{opacity:1}}
@keyframes ocuK{0%,50%{opacity:0;transform:scale(0)}58%{opacity:1;transform:scale(1.3)}64%,100%{opacity:1;transform:scale(1)}}
@keyframes glowK{0%,56%{opacity:0;transform:scale(1)}57%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.32)}}
@keyframes nameK{0%,60%{opacity:0;transform:translateY(10px)}70%,100%{opacity:1;transform:none}}
@keyframes tagK{0%,68%{opacity:0}78%,100%{opacity:1}}
@keyframes barK{0%,24%{transform:scaleX(0)}86%,100%{transform:scaleX(1)}}
@keyframes st1{0%,22%{opacity:0}26%,46%{opacity:1}50%,100%{opacity:0}}
@keyframes st2{0%,46%{opacity:0}50%,66%{opacity:1}70%,100%{opacity:0}}
@keyframes st3{0%,66%{opacity:0}70%,84%{opacity:1}88%,100%{opacity:0}}
@keyframes st4{0%,84%{opacity:0}88%,100%{opacity:1}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}
.a{animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.7,.2,1);animation-fill-mode:both}
.cycle{animation-name:cycle;animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear}
.fb{transform-box:fill-box;transform-origin:center}
.ring{animation-name:ringK}.ped{animation-name:pedK}.ent{animation-name:entK}.base{animation-name:baseK}.ocu{animation-name:ocuK}.glow{animation-name:glowK}.name{animation-name:nameK}.tag{animation-name:tagK}
.col0{animation-name:col0;transform-box:fill-box;transform-origin:50% 100%}
.col1{animation-name:col1;transform-box:fill-box;transform-origin:50% 100%}
.col2{animation-name:col2;transform-box:fill-box;transform-origin:50% 100%}
.col3{animation-name:col3;transform-box:fill-box;transform-origin:50% 100%}
.col4{animation-name:col4;transform-box:fill-box;transform-origin:50% 100%}
.col5{animation-name:col5;transform-box:fill-box;transform-origin:50% 100%}
.bar{animation-name:barK;transform-origin:left}.st1{animation-name:st1}.st2{animation-name:st2}.st3{animation-name:st3}.st4{animation-name:st4}
.halo{animation:breathe 6s ease-in-out infinite}
.btn-outline{transition:background .2s,border-color .2s,transform .2s}.btn-outline:hover{background:rgba(255,255,255,.08)!important;border-color:#6b7bbf!important;transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.st1,.st2,.st3{display:none}}
</style>
</helmet>
<div style="--accent:{{accent}};position:relative;overflow:hidden;min-height:900px;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#e9ecf3;font-family:'Inter',system-ui,sans-serif">
  <div class="halo" style="position:absolute;left:50%;top:50%;width:560px;height:560px;border-radius:50%;border:1px solid #1b212c"></div>
  <div class="halo" style="position:absolute;left:50%;top:50%;width:860px;height:860px;border-radius:50%;border:1px solid #141922;animation-delay:-3s"></div>
  <div class="cycle" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px">
    <svg width="220" height="220" viewBox="0 0 120 120" role="img" aria-label="Logo Le Pantheon"><circle class="a ring" cx="60" cy="60" r="54" fill="none" stroke="{{accent}}" stroke-width="6" transform="rotate(-90 60 60)"/><circle class="a fb glow" cx="60" cy="60" r="54" fill="none" stroke="{{accent}}" stroke-width="1.5"/><polygon class="a fb ped" points="28,48 92,48 60,28" fill="#E9ECF3"/><rect class="a fb ent" x="28" y="51" width="64" height="5" fill="#E9ECF3"/><rect class="a col0" x="32" y="59" width="8" height="26" fill="#E9ECF3"/><rect class="a col1" x="48" y="59" width="8" height="26" fill="#E9ECF3"/><rect class="a col2" x="64" y="59" width="8" height="26" fill="#E9ECF3"/><rect class="a col3" x="80" y="59" width="8" height="26" fill="#E9ECF3"/><rect class="a fb base" x="28" y="88" width="64" height="4" fill="#E9ECF3"/></svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <span class="a name" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:.02em">Le Pantheon</span>
      <span class="a tag" style="font-size:15px;color:#8f98a8">Tous tes jeux. Toutes tes légendes.</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:34px">
      <div style="width:300px;height:4px;border-radius:99px;background:#232a37;overflow:hidden"><div class="a bar" style="height:100%;background:{{accent}}"></div></div>
      <div role="status" style="position:relative;height:20px;width:300px;font-size:13px;color:#c3cad6;text-align:center">
        <span class="a st1" style="position:absolute;inset:0">Recherche de Steam…</span>
        <span class="a st2" style="position:absolute;inset:0">Lecture de ta bibliothèque…</span>
        <span class="a st3" style="position:absolute;inset:0">Chargement des succès…</span>
        <span class="a st4" style="position:absolute;inset:0">Prêt</span>
      </div>
    </div>
  </div>
  <a class="btn-outline" href="Main.dc.html" style="position:absolute;bottom:32px;display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 22px;border-radius:12px;border:1px solid #2a3243;color:#c3cad6;font-size:14px;font-weight:500;text-decoration:none">Ouvrir la bibliothèque</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4d8dff","options":["#4d8dff","#ffffff","#c58cff","#ff5a64"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4d8dff' };
  }
}
</script>
</body>
</html>
